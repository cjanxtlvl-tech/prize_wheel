services:
  prize-wheel:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    container_name: prize-wheel
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
